services:
  web:
    build: .
    command: bash -c "python sudo/manage.py makemigrations && python sudo/manage.py migrate && python sudo/manage.py runserver 0.0.0.0:8000"
    container_name: myapp
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myappdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
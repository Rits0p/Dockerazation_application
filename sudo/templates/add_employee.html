{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .form-container{
            background:white;
            padding:30px;
            width:400px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .form-container h2{
            text-align:center;
            margin-bottom:20px;
            color:#1e293b;
        }

        .form-group{
            margin-bottom:15px;
        }

        .form-group label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
            color:#334155;
        }

        .form-group input{
            width:100%;
            padding:10px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            outline:none;
        }

        .form-group input:focus{
            border-color:#2563eb;
        }

        .submit-btn{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        .submit-btn:hover{
            background:#1d4ed8;
        }

        .messages{
            margin-bottom:20px;
        }

        .message{
            padding:12px 16px;
            border-radius:8px;
            margin-bottom:10px;
            font-size:14px;
        }

        .message.error{
            background:#fee2e2;
            color:#991b1b;
            border:1px solid #fecaca;
        }

        .message.success{
            background:#dcfce7;
            color:#166534;
            border:1px solid #bbf7d0;
        }
    </style>
</head>
<body>

    <div class="form-container">

        <h2>Add Employee</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="">

            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="Enter employee name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter employee email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department" placeholder="Enter department" required>
            </div>

            <button type="submit" class="submit-btn">
                Save Employee
            </button>

        </form>

    </div>

</body>
</html>
